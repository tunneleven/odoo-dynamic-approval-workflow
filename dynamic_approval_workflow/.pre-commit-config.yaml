exclude: |
  (?x)
  /static/lib/
repos:
  - repo: https://github.com/oca/pylint-odoo
    rev: v9.1.2
    hooks:
      - id: pylint_odoo
        files: ^dynamic_approval_workflow/
        args:
          - --rcfile=dynamic_approval_workflow/.pylintrc
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        files: ^dynamic_approval_workflow/
        args:
          - --config=dynamic_approval_workflow/.ruff.toml
          - --fix
      - id: ruff-format
        files: ^dynamic_approval_workflow/
        args:
          - --config=dynamic_approval_workflow/.ruff.toml
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: ^dynamic_approval_workflow/
        types_or: [css, xml]
