name: Copilot Review Loop

on:
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write

jobs:
  handle_copilot_review:
    runs-on: ubuntu-latest
    steps:
      - name: Route Copilot review outcome
        uses: actions/github-script@v7
        env:
          REVIEW_FIX_ASSIGNEE: ${{ vars.REVIEW_FIX_ASSIGNEE }}
          CODEX_AGENT_ASSIGNEE: ${{ vars.CODEX_AGENT_ASSIGNEE }}
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.info("No pull request in payload.");
              return;
            }

            const isReviewEvent = context.eventName === "pull_request_review";
            const review = context.payload.review;
            const reviewComment = context.payload.comment;

            const reviewer = isReviewEvent
              ? (review?.user?.login || "").toLowerCase()
              : (reviewComment?.user?.login || "").toLowerCase();

            const state = isReviewEvent
              ? (review?.state || "").toLowerCase()
              : "commented";

            const sourceId = isReviewEvent ? String(review?.id || "review") : String(reviewComment?.id || "review-comment");
            const sourceUrl = isReviewEvent ? review?.html_url : reviewComment?.html_url;

            if (!reviewer.includes('copilot')) {
              core.info(`Skip non-Copilot review from ${reviewer || 'unknown reviewer'}.`);
              return;
            }

            function linkedIssuesFromPrBody(body) {
              const linked = new Set();
              const regex = /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi;
              let match;
              while ((match = regex.exec(body || '')) !== null) {
                linked.add(Number(match[1]));
              }
              return [...linked];
            }

            async function syncIssueLabels(issueNumber, addLabels, removeLabels) {
              for (const label of removeLabels) {
                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNumber,
                    name: label,
                  });
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
              }
              if (addLabels.length) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: addLabels,
                });
              }
            }

            async function assignPr(assignee) {
              if (!assignee) return;
              try {
                await github.rest.issues.addAssignees({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  assignees: [assignee],
                });
              } catch (error) {
                core.warning(`Unable to assign ${assignee} to PR #${pr.number}: ${error.message}`);
              }
            }

            async function replyToReviewComment(assignee) {
              if (isReviewEvent || !reviewComment?.id) return;
              const mention = assignee ? `@${assignee}` : "Maintainer";
              try {
                await github.rest.pulls.createReplyForReviewComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  comment_id: reviewComment.id,
                  body: `${mention} queued this review comment for automatic fix handling.`,
                });
              } catch (error) {
                core.warning(`Unable to reply on review comment #${reviewComment.id}: ${error.message}`);
              }
            }

            async function ensureComment(marker, body) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                per_page: 100,
              });
              const exists = comments.some(
                (comment) =>
                  comment.user?.type === 'Bot' &&
                  typeof comment.body === 'string' &&
                  comment.body.includes(marker),
              );
              if (exists) {
                core.info(`Marker ${marker} already posted.`);
                return;
              }
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
            }

            const linkedIssues = linkedIssuesFromPrBody(pr.body || '');
            core.info(`Copilot review state: ${state}; linked issues: ${linkedIssues.join(', ') || 'none'}`);

            if (state === "changes_requested" || state === "commented") {
              const assignee =
                process.env.REVIEW_FIX_ASSIGNEE || process.env.CODEX_AGENT_ASSIGNEE || "";
              const mention = assignee ? `@${assignee}` : "@codex";
              const marker = `<!-- copilot-review-loop:action-required:${sourceId} -->`;
              const preview = (reviewComment?.body || "")
                .replace(/\s+/g, " ")
                .trim()
                .slice(0, 200);
              const commentBody = [
                marker,
                `${mention} Copilot review feedback needs a fix commit on this PR.`,
                '',
                `Review source: ${sourceUrl || pr.html_url}`,
                preview ? `Latest comment excerpt: "${preview}"` : "",
                '',
                'Required response format:',
                '1. List each review finding you addressed.',
                '2. Provide file-level change summary.',
                '3. Confirm checks reran successfully.',
              ]
                .filter(Boolean)
                .join('\n');

              await ensureComment(marker, commentBody);
              await assignPr(assignee);
              await replyToReviewComment(assignee);

              for (const issueNumber of linkedIssues) {
                await syncIssueLabels(
                  issueNumber,
                  ["status:in-progress", "needs:review-fix"],
                  ["status:in-review", "status:todo"],
                );
              }
              return;
            }

            if (state === 'approved') {
              for (const issueNumber of linkedIssues) {
                await syncIssueLabels(
                  issueNumber,
                  ["status:in-review"],
                  ["status:in-progress", "status:todo", "needs:review-fix"],
                );
              }
              return;
            }

            core.info(`No action for Copilot review state '${state}'.`);
