name: Copilot Review Loop

on:
  pull_request_review:
    types: [submitted]

permissions:
  issues: write
  pull-requests: read

jobs:
  handle_copilot_review:
    runs-on: ubuntu-latest
    steps:
      - name: Route Copilot review outcome
        uses: actions/github-script@v7
        env:
          COPILOT_AGENT_ASSIGNEE: ${{ vars.COPILOT_AGENT_ASSIGNEE }}
        with:
          script: |
            const pr = context.payload.pull_request;
            const review = context.payload.review;
            const reviewer = (review?.user?.login || '').toLowerCase();
            const state = (review?.state || '').toLowerCase();

            if (!reviewer.includes('copilot')) {
              core.info(`Skip non-Copilot review from ${reviewer || 'unknown reviewer'}.`);
              return;
            }

            function linkedIssuesFromPrBody(body) {
              const linked = new Set();
              const regex = /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi;
              let match;
              while ((match = regex.exec(body || '')) !== null) {
                linked.add(Number(match[1]));
              }
              return [...linked];
            }

            async function syncIssueLabels(issueNumber, addLabels, removeLabels) {
              for (const label of removeLabels) {
                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNumber,
                    name: label,
                  });
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
              }
              if (addLabels.length) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: addLabels,
                });
              }
            }

            async function ensureComment(marker, body) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                per_page: 100,
              });
              const exists = comments.some(
                (comment) =>
                  comment.user?.type === 'Bot' &&
                  typeof comment.body === 'string' &&
                  comment.body.includes(marker),
              );
              if (exists) {
                core.info(`Marker ${marker} already posted.`);
                return;
              }
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
            }

            const linkedIssues = linkedIssuesFromPrBody(pr.body || '');
            core.info(`Copilot review state: ${state}; linked issues: ${linkedIssues.join(', ') || 'none'}`);

            if (state === 'changes_requested') {
              const marker = `<!-- copilot-review-loop:changes_requested:${review.id} -->`;
              const commentBody = [
                marker,
                '@copilot Please address the requested changes from your latest review and push a fix commit.',
                '',
                `Review: ${review.html_url}`,
                '',
                'Required response format:',
                '1. List each review finding you addressed.',
                '2. Provide file-level change summary.',
                '3. Confirm checks reran successfully.',
              ].join('\n');

              await ensureComment(marker, commentBody);

              const assignee = process.env.COPILOT_AGENT_ASSIGNEE || 'copilot-swe-agent';
              try {
                await github.rest.issues.addAssignees({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  assignees: [assignee],
                });
              } catch (error) {
                core.warning(`Unable to assign ${assignee} to PR #${pr.number}: ${error.message}`);
              }

              for (const issueNumber of linkedIssues) {
                await syncIssueLabels(issueNumber, ['status:in-progress'], ['status:in-review', 'status:todo']);
              }
              return;
            }

            if (state === 'approved') {
              for (const issueNumber of linkedIssues) {
                await syncIssueLabels(issueNumber, ['status:in-review'], ['status:in-progress', 'status:todo']);
              }
              return;
            }

            core.info(`No action for Copilot review state '${state}'.`);
