name: Agent Auto Pick

on:
  issues:
    types: [opened, reopened, labeled, unlabeled, unassigned]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: agent-auto-pick
  cancel-in-progress: false

jobs:
  auto_pick:
    runs-on: ubuntu-latest
    steps:
      - name: Claim ready tasks for configured agents
        uses: actions/github-script@v7
        env:
          CODEX_AGENT_ASSIGNEE: ${{ vars.CODEX_AGENT_ASSIGNEE }}
          COPILOT_AGENT_ASSIGNEE: ${{ vars.COPILOT_AGENT_ASSIGNEE }}
          ANTIGRAVITY_AGENT_ASSIGNEE: ${{ vars.ANTIGRAVITY_AGENT_ASSIGNEE }}
        with:
          script: |
            const configs = [
              { label: "agent:codex", assignee: process.env.CODEX_AGENT_ASSIGNEE, agentName: "Codex" },
              { label: "agent:copilot", assignee: process.env.COPILOT_AGENT_ASSIGNEE, agentName: "Copilot" },
              { label: "agent:antigravity", assignee: process.env.ANTIGRAVITY_AGENT_ASSIGNEE, agentName: "Antigravity" },
            ].filter((item) => item.assignee);

            function hasLabel(issue, label) {
              return (issue.labels || []).some((item) => item.name === label);
            }

            async function commentOnce(issueNumber, marker, body) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                per_page: 100,
              });
              const exists = comments.some(
                (comment) =>
                  comment.user?.type === "Bot" &&
                  typeof comment.body === "string" &&
                  comment.body.includes(marker),
              );
              if (exists) return;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
            }

            async function claimIssue(issue, assignee, agentName, sourceLabel) {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                assignees: [assignee],
              });
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  name: "status:todo",
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ["status:in-progress"],
              });
              const marker = `<!-- agent-auto-pick:${issue.number}:${assignee} -->`;
              const body = [
                marker,
                `Auto-claimed for **${agentName}** (${assignee}).`,
                "",
                `Routing label: \`${sourceLabel}\``,
                "Next action: create branch, open PR with TASK ID and `Closes #<issue>` in the PR body.",
              ].join("\n");
              await commentOnce(issue.number, marker, body);
            }

            async function findReadyIssue(agentLabel) {
              const { data } = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: "open",
                sort: "created",
                direction: "asc",
                per_page: 100,
                labels: `${agentLabel},status:todo,state:ready`,
              });

              return data.find((issue) => {
                if (issue.pull_request) return false;
                if ((issue.assignees || []).length > 0) return false;
                if (hasLabel(issue, "state:blocked")) return false;
                return true;
              });
            }

            for (const config of configs) {
              const issue = await findReadyIssue(config.label);
              if (!issue) {
                core.info(`No ready issue found for ${config.label}.`);
                continue;
              }
              core.info(`Claiming issue #${issue.number} for ${config.assignee}.`);
              await claimIssue(issue, config.assignee, config.agentName, config.label);
            }

            if (!configs.length) {
              core.info("No assignee variables configured; skip agent:either routing.");
              return;
            }

            const eitherIssue = await findReadyIssue("agent:either");
            if (!eitherIssue) {
              core.info("No ready issue found for agent:either.");
              return;
            }

            const index = eitherIssue.number % configs.length;
            const target = configs[index];
            core.info(
              `Claiming issue #${eitherIssue.number} from agent:either for ${target.assignee}.`,
            );
            await claimIssue(eitherIssue, target.assignee, target.agentName, "agent:either");
