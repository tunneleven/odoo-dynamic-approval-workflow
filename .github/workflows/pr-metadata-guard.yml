name: PR Metadata Guard

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  pull-requests: read

jobs:
  validate_pr_metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce TASK ID and linked issue keyword
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';
            const taskIdRegex = /TASK-P\d+-\d+[a-zA-Z]?/;
            const closesRegex = /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#\d+/i;

            const missing = [];
            if (!taskIdRegex.test(body)) {
              missing.push('TASK ID (e.g., TASK-P1-001)');
            }
            if (!closesRegex.test(body)) {
              missing.push('issue link keyword (e.g., Closes #123)');
            }

            if (missing.length) {
              core.setFailed(`PR body is missing: ${missing.join(' and ')}`);
            }
